{{ $p := .Paginator }}
{{ if gt $p.TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{ if $p.HasPrev }}<a href="{{ $p.Prev.URL }}" rel="prev">Newer</a>{{ else }}<span></span>{{ end }}
  <span class="pagination-count">{{ $p.PageNumber }} / {{ $p.TotalPages }}</span>
  {{ if $p.HasNext }}<a href="{{ $p.Next.URL }}" rel="next">Older</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
