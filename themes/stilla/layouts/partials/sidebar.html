<aside class="sidebar">
  <a class="site-name" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
    <span></span><span></span>
  </button>
  <div class="sidebar-menu" id="site-menu">
    <nav class="site-nav" aria-label="Main">
      <a href="{{ "posts/" | relURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>Writing</a>
      {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="sidebar-foot">
      {{ partial "social.html" . }}
      <span class="copyright">&copy; {{ now.Format "2006" }} {{ site.Params.Author }}</span>
    </div>
  </div>
</aside>
<script>
(function () {
  var root = document.documentElement;
  var btn = document.querySelector('.menu-toggle');
  var menu = document.getElementById('site-menu');
  function set(open) {
    root.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', open);
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  btn.addEventListener('click', function () { set(!root.classList.contains('menu-open')); });
  menu.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
  window.matchMedia('(min-width: 901px)').addEventListener('change', function (e) { if (e.matches) set(false); });
})();
</script>
