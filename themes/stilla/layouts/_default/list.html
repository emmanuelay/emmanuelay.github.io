{{ define "main" }}
<section class="listing">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <ul class="entries">
    {{ range .Paginator.Pages }}
    {{ partial "entry.html" . }}
    {{ end }}
  </ul>
  {{ partial "paginator.html" . }}
</section>
{{ end }}
